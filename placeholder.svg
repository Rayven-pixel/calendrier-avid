<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Photo produit de démonstration">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1d5a44"/>
      <stop offset="100%" stop-color="#062319"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1D894"/>
      <stop offset="100%" stop-color="#8a6a25"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Illustration neutre : disque de frein stylisé. À remplacer par vos photos. -->
  <circle cx="400" cy="230" r="150" fill="none" stroke="url(#gold)" stroke-width="18"/>
  <circle cx="400" cy="230" r="70" fill="none" stroke="#D4AF5A" stroke-width="6" opacity=".7"/>
  <circle cx="400" cy="230" r="14" fill="#D4AF5A"/>
  <g fill="#D4AF5A" opacity=".8">
    <circle cx="400" cy="152" r="7"/><circle cx="400" cy="308" r="7"/>
    <circle cx="322" cy="230" r="7"/><circle cx="478" cy="230" r="7"/>
  </g>
  <text x="400" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#F1D894">PHOTO PRODUIT (DÉMO)</text>
</svg>
